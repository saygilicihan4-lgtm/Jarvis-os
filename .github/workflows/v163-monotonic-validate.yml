name: Validate v163 Monotonic Session Cutoff

on:
  push:
    branches: [ jarvis-session-lifecycle-v163 ]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-session-lifecycle-v163
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact server patch
        run: node scripts/v163-monotonic-server-patch.js
      - name: Validate syntax and security regression tests
        run: |
          node --check server.js
          node --check jarvis-session-lifecycle.js
          node --check session-lifecycle-selftest.js
          node --check session-lifecycle-http-selftest.js
          node session-lifecycle-selftest.js
          node session-lifecycle-http-selftest.js
          node session-bootstrap-selftest.js
          git diff --check
      - name: Commit server integration
        run: |
          git config user.name "Jarvis Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "server patch already committed"
          else
            git commit -m "security: enforce one-way legacy session cutoff"
            git push origin HEAD:jarvis-session-lifecycle-v163
          fi
