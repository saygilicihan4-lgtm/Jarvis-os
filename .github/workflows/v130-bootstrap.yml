name: v130 Mobile Relay Bootstrap

on:
  push:
    branches: [ jarvis-mobile-language-relay-v130 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-mobile-language-relay-v130
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic v130 integration patch
        run: |
          node scripts/v130-apply.js
          git restore --source=HEAD -- scripts/v130-apply.js .github/workflows/v130-bootstrap.yml
      - name: Verify syntax and relay invariants before commit
        run: |
          node --check server.js
          node --check worker.js
          node --check jarvis-mobile-tts-relay.js
          node --check jarvis-tts-locale-router.js
          node --check mobile-tts-relay-selftest.js
          node mobile-tts-relay-selftest.js
      - name: Commit integrated v130 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js worker.js public/index.html
          git diff --cached --stat
          git commit -m "Jarvis Mobile Language Relay v130"
          git push origin HEAD:jarvis-mobile-language-relay-v130
