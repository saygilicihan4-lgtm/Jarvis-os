name: Jarvis v181 Branch Patch

on:
  push:
    branches: [ jarvis-tricore-live-state-v181 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-tricore-live-state-v181
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact-anchor patch
        run: node scripts/apply-v181-live-state.js
      - name: Verify patched syntax and privacy markers
        run: |
          node --check worker.js
          node --check server.js
          grep -q "case 'state':result=conversation.state(sessionId)" worker.js
          grep -q "/api/worker/mobile-language-state" worker.js
          grep -q "/api/worker/mobile-language-state" server.js
          grep -q "applyMobileTriCoreCognitive" public/index.html
          ! grep -n "mobile-language-state.*transcript\|mobile-language-state.*reply\|mobile-language-state.*note" worker.js
          git diff --check
      - name: Commit patched transport
        shell: bash
        run: |
          if git diff --quiet -- worker.js server.js public/index.html; then
            echo "No transport changes needed."
            exit 0
          fi
          git config user.name "jarvis-ci"
          git config user.email "jarvis-ci@users.noreply.github.com"
          git add worker.js server.js public/index.html
          git commit -m "Wire live tri-core cognitive state transport v181"
          git push origin HEAD:jarvis-tricore-live-state-v181
