name: Jarvis Reference Cockpit CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reference cockpit syntax
        run: |
          node --check public/reference-cockpit.js
          node --check public/reference-cockpit-i18n.js
          node --check public/mobile-canonical-cockpit.js
          node --check public/mobile-visual-fit-v189.js
          node --check public/mobile-approval-review.js
          node --check public/tri-core-hologram.js
          node --check reference-cockpit-selftest.js
          node --check reference-cockpit-i18n-selftest.js
          node --check mobile-canonical-cockpit-selftest.js
          node --check mobile-visual-fit-v189-selftest.js
          node --check mobile-approval-review-selftest.js
      - name: Reference cockpit motion and authority selftest
        run: node reference-cockpit-selftest.js
      - name: Reference cockpit multilingual selftest
        run: node reference-cockpit-i18n-selftest.js
      - name: Canonical mobile cockpit selftest
        run: node mobile-canonical-cockpit-selftest.js
      - name: Mobile visual fit selftest
        run: node mobile-visual-fit-v189-selftest.js
      - name: Mobile approval review selftest
        run: node mobile-approval-review-selftest.js
