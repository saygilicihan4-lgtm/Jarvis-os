name: Jarvis Reference Cockpit CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reference cockpit syntax
        run: |
          node --check public/reference-cockpit.js
          node --check public/reference-cockpit-i18n.js
          node --check public/mobile-canonical-cockpit.js
          node --check public/mobile-visual-fit-v189.js
          node --check public/mobile-native-v190.js
          node --check public/mobile-reference-v195.js
          node --check tests/mobile-reference-browser.cjs
          node --check public/mobile-viewport-v192.js
          node --check public/mobile-session-security-v195.js
          node --check public/mobile-approval-review.js
          node --check public/tri-core-hologram.js
          node --check reference-cockpit-selftest.js
          node --check reference-cockpit-i18n-selftest.js
          node --check mobile-canonical-cockpit-selftest.js
          node --check mobile-visual-fit-v189-selftest.js
          node --check mobile-native-v190-selftest.js
          node --check mobile-viewport-v192-selftest.js
          node --check mobile-session-security-v195-selftest.js
          node --check mobile-approval-review-selftest.js
      - name: Reference cockpit motion and authority selftest
        run: node reference-cockpit-selftest.js
      - name: Reference cockpit multilingual selftest
        run: node reference-cockpit-i18n-selftest.js
      - name: Canonical mobile cockpit selftest
        run: node mobile-canonical-cockpit-selftest.js
      - name: Mobile visual fit compatibility selftest
        run: node mobile-visual-fit-v189-selftest.js
      - name: Native mobile cockpit selftest
        run: node mobile-native-v190-selftest.js
      - name: Dynamic mobile viewport selftest
        run: node mobile-viewport-v192-selftest.js
      - name: Mobile session security selftest
        run: node mobile-session-security-v195-selftest.js
      - name: Mobile approval review selftest
        run: node mobile-approval-review-selftest.js
      - name: Avatar syntax and isolated security checks
        run: |
          node --check public/avatar-security-v198.js
          node --check public/avatar-3d-v199.js
          npm run security:check

  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Mobile DOM, touch and viewport regression
        run: node tests/mobile-reference-browser.cjs
        env:
          JARVIS_TEST_BROWSER: ${{ matrix.browser }}
          JARVIS_SCREENSHOTS: artifacts/mobile-reference
      - name: Original 3D avatar and audio clock regression
        run: node tests/avatar-3d-browser.cjs
        env:
          JARVIS_TEST_BROWSER: ${{ matrix.browser }}
          JARVIS_SCREENSHOTS: artifacts/mobile-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reference-${{ matrix.browser }}
          path: artifacts/mobile-reference
          if-no-files-found: ignore
