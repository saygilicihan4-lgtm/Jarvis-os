name: Apply v163 Session Lifecycle

on:
  push:
    branches: [ jarvis-session-lifecycle-v163 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-session-lifecycle-v163
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply marker-guarded v163 integration
        run: node scripts/apply-v163-session-lifecycle-v2.js
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate session security
        run: |
          node --check server.js
          node --check jarvis-session-lifecycle.js
          node --check session-lifecycle-selftest.js
          node --check session-lifecycle-http-selftest.js
          node session-lifecycle-selftest.js
          node session-lifecycle-http-selftest.js
          node session-bootstrap-selftest.js
          node selftest.js
          git diff --check
      - name: Commit only verified integration
        run: |
          git rm -f .github/workflows/apply-v163-session-lifecycle.yml scripts/apply-v163-session-lifecycle.js scripts/apply-v163-session-lifecycle-v2.js .v163-trigger
          git config user.name "Jarvis Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js jarvis-session-lifecycle.js session-lifecycle-selftest.js session-lifecycle-http-selftest.js selftest.js
          git commit -m "Jarvis Durable Session Lifecycle v163"
          git push origin HEAD:jarvis-session-lifecycle-v163
