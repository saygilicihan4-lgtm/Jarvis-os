name: Apply v163 Session Lifecycle

on:
  push:
    branches: [ jarvis-session-lifecycle-v163 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-session-lifecycle-v163
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair bounded integration anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v163-session-lifecycle.js')
          s=p.read_text()
          old="replaceOnce('server.js',oldExchange,newExchange,'code managed session');"
          new="""{
            let s=fs.readFileSync('server.js','utf8');
            const start=\"  if(pathname==='/api/session/exchange'&&req.method==='POST'){\";
            const end=\"\\n\\n  if(pathname==='/api/pairing/create'&&req.method==='POST'){\";
            const a=s.indexOf(start),b=a<0?-1:s.indexOf(end,a+start.length);
            if(a<0||b<0)throw new Error('code managed session: bounded anchor not found');
            if(s.indexOf(start,a+start.length)>=0)throw new Error('code managed session: start anchor not unique');
            s=s.slice(0,a)+newExchange+s.slice(b);
            fs.writeFileSync('server.js',s);
          }"""
          if s.count(old)!=1:
              raise SystemExit('expected one exchange patch call')
          s=s.replace(old,new,1)
          old_route="reminderStorage:dbReady?'postgres':'unavailable'});"
          new_route="reminderStorage:dbReady?'postgresql':'unavailable',pushStorage:dbReady?'postgresql':'unavailable'});"
          if s.count(old_route)!=1:
              raise SystemExit('expected one db status anchor fragment')
          s=s.replace(old_route,new_route,1)
          policy_start="replaceOnce('jarvis-session-lifecycle.js',"
          a=s.find(policy_start)
          b=s.find("console.log('v163 integration patch applied');",a)
          if a<0 or b<0:
              raise SystemExit('expected policy patch tail')
          s=s[:a]+s[b:]
          p.write_text(s)
          PY
      - name: Apply exact v163 integration
        run: node scripts/apply-v163-session-lifecycle.js
      - name: Validate session security
        run: |
          node --check server.js
          node --check jarvis-session-lifecycle.js
          node --check session-lifecycle-selftest.js
          node session-lifecycle-selftest.js
          node session-bootstrap-selftest.js
          git diff --check
      - name: Commit integrated files
        run: |
          git config user.name "Jarvis Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js jarvis-session-lifecycle.js
          git commit -m "Jarvis Durable Session Lifecycle v163"
          git push origin HEAD:jarvis-session-lifecycle-v163
