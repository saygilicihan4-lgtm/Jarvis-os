name: Approval target v157 branch patch
# rerun after replacing brittle implementation assertion with behavioral target-binding coverage

on:
  push:
    branches: [jarvis-approval-target-binding-v157]
    paths: [.github/workflows/approval-target-v157-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-approval-target-binding-v157
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bind approval mission selection to actual user text
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='worker.js';
          const src=fs.readFileSync(p,'utf8');
          const start=src.indexOf("function approveMissionGate({missionId=''}={}){");
          const end=src.indexOf('function missionSummaryText(m){',start);
          if(start<0||end<0)throw new Error('approveMissionGate boundaries not found');
          const replacement=`function approveMissionGate({missionId='',approvalIntent=null,userText=''}={}){\n  const engine=getMissionEngine();\n  const approvalModule=require('./jarvis-approval-intent');\n  const pending=engine.listMissions(WORKSPACE,{limit:50}).filter(row=>{\n    if(row.status!=='waiting_dependency')return false;\n    const pendingStep=engine.currentStep(row);\n    return !!(pendingStep&&pendingStep.error&&pendingStep.error.dependency==='approval');\n  });\n  const resolved=approvalModule.resolveApprovalTarget({\n    approval:approvalIntent||approvalModule.classifyApprovalIntent(userText),\n    pending:pending.map(row=>{\n      const pendingStep=engine.currentStep(row);\n      return{id:row.id,stepName:pendingStep&&pendingStep.name||''};\n    }),\n    requestedMissionId:String(missionId||'').trim()\n  });\n  if(!resolved.ok)throw new Error(resolved.message||'Onay hedefi güvenli biçimde çözümlenemedi.');\n  const mission=engine.loadMission(WORKSPACE,resolved.missionId);\n  if(!mission)throw new Error('Onaylanacak görev bulunamadı: '+resolved.missionId);\n  const step=engine.currentStep(mission);\n  if(!step||mission.status!=='waiting_dependency'||!step.error||step.error.dependency!=='approval'){\n    throw new Error('Bu görev şu anda açık kullanıcı onayı beklemiyor.');\n  }\n  step.meta={...(step.meta||{}),approvedAt:new Date().toISOString(),approvalKind:'explicit_user',approvalSurface:resolved.surface||null,approvalTargetReason:resolved.reason||null};\n  step.status='pending';\n  step.error=null;\n  mission.status='queued';\n  if(Array.isArray(mission.history)){\n    mission.history.push({at:new Date().toISOString(),event:'step_explicitly_approved',step:step.name});\n    if(mission.history.length>200)mission.history=mission.history.slice(-200);\n  }\n  return engine.saveMission(WORKSPACE,mission);\n}\n`;
          let next=src.slice(0,start)+replacement+src.slice(end);
          const oldCall="const approved=approveMissionGate({missionId:String(a.missionId||'').trim()});";
          const newCall="const approved=approveMissionGate({missionId:String(a.missionId||'').trim(),approvalIntent,userText});";
          if(!next.includes(oldCall))throw new Error('approve_mission_action call site not found');
          next=next.replace(oldCall,newCall);
          const oldDesc="properties:{missionId:{type:'string',description:'Varsa tam mission kimliği; boşsa en yeni onay bekleyen görev kullanılır.'}},";
          const newDesc="properties:{missionId:{type:'string',description:'İsteğe bağlı mission kimliği. Kullanıcının bu turdaki açık hedefiyle uyuşmazsa reddedilir; birden fazla onay bekleyen görevde kullanıcı hedefi veya tam missionId açıkça belirtilmelidir.'}},";
          if(!next.includes(oldDesc))throw new Error('approve_mission_action schema description not found');
          next=next.replace(oldDesc,newDesc);
          fs.writeFileSync(p,next,'utf8');
          NODE
          node --check worker.js
          node approval-gate-selftest.js
      - name: Commit Worker target binding
        run: |
          git config user.name "saygilicihan4-lgtm"
          git config user.email "saygilicihan4@gmail.com"
          git add worker.js
          git commit -m "Bind approval mission target to user intent v157"
          git push origin HEAD:jarvis-approval-target-binding-v157
