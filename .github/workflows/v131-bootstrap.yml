name: v131 Mobile Conversation Bootstrap

on:
  push:
    branches: [ jarvis-mobile-conversation-v131 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-mobile-conversation-v131
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic v131 integration
        run: node scripts/v131-apply.js
      - name: Verify syntax and mobile conversation invariants
        run: |
          node --check server.js
          node --check worker.js
          node --check jarvis-mobile-language-relay.js
          node --check jarvis-mobile-language-conversation.js
          node --check public/mobile-language-chat.js
          node --check mobile-language-conversation-selftest.js
          node mobile-language-conversation-selftest.js
          node language-conversation-selftest.js
          node language-chat-ui-selftest.js
      - name: Commit integrated v131 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js worker.js public/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Jarvis Mobile Conversation v131 integration"
          git push origin HEAD:jarvis-mobile-conversation-v131
