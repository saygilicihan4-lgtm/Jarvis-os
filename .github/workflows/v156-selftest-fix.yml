name: v156 selftest fix

on:
  push:
    branches: [jarvis-youtube-auth-approval-revoke-v156]
    paths: [.github/workflows/v156-selftest-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-youtube-auth-approval-revoke-v156
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make v156 order assertion format-safe
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='approval-gate-selftest.js';
          const src=fs.readFileSync(p,'utf8');
          const old="assert.ok(youtubeAuthBlock.indexOf('delete step.meta.approvedAt;')<youtubeAuthBlock.indexOf(\"dependency:'youtube_auth'\"),'approval proof must be revoked before auth dependency is persisted');";
          const nextLine="assert.ok(/delete step\\.meta\\.approvedAt;[\\s\\S]*dependency\\s*:\\s*['\\\"]youtube_auth['\\\"]/.test(youtubeAuthBlock),'approval proof must be revoked before auth dependency is persisted');";
          if(!src.includes(old))throw new Error('expected brittle v156 order assertion missing');
          const next=src.replace(old,nextLine);
          fs.writeFileSync(p,next,'utf8');
          NODE
          node --check approval-gate-selftest.js
          node approval-gate-selftest.js
      - name: Commit regression-test fix
        run: |
          git config user.name "saygilicihan4-lgtm"
          git config user.email "saygilicihan4@gmail.com"
          git add approval-gate-selftest.js
          git commit -m "Make v156 approval order assertion format-safe"
          git push origin HEAD:jarvis-youtube-auth-approval-revoke-v156
