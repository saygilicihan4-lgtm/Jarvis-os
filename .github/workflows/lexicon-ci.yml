name: Jarvis Adaptive Speech CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ jarvis-adaptive-lexicon-v18 ]

jobs:
  adaptive-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check worker.js
          node --check lexicon-worker-selftest.js
          node --check lexicon-ui-selftest.js
          python -m py_compile jarvis-local-stt-v4.py
          python -m py_compile stt-lexicon-selftest.py
          python -m py_compile stt-adaptive-selftest.py
      - name: Lexicon acceptance syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./JARVIS-LEXICON-ACCEPTANCE.ps1 -Raw)) | Out-Null
      - name: STT dynamic hotwords
        run: python stt-lexicon-selftest.py
      - name: STT adaptive endpointing
        run: python stt-adaptive-selftest.py
      - name: Adaptive UI
        run: node lexicon-ui-selftest.js
      - name: Adaptive Worker integration
        run: node lexicon-worker-selftest.js
      - name: Safe session language switching
        run: node session-language-selftest.js
      - name: Runtime speech provider mapping and learning
        run: node speech-runtime-selftest.js
      - name: Automatic STT language evidence
        run: python stt-language-selftest.py
      - name: Language session Worker HTTP integration
        run: node language-session-worker-selftest.js
      - name: Language conversation output and playback receipts
        run: node language-conversation-selftest.js
      - name: Multilingual conversation UI lifecycle
        run: node language-chat-ui-selftest.js
      - name: Locale-bound SAPI renderer syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./jarvis-language-sapi.ps1 -Raw)) | Out-Null
