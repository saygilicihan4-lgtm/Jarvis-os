          node --check creator-storyboard-selftest.js
          node --check creator-batch-mission-selftest.js
          node --check creator-quality-selftest.js
          node --check creator-longform-selftest.js
          node --check creator-duration-fit-selftest.js
          node --check creator-longform-edit-selftest.js
          node --check creator-web-media-selftest.js
          node --check creator-visual-relevance-selftest.js
          node --check creator-semantic-diversity-selftest.js
          node --check creator-semantic-relevance-floor-selftest.js
          node --check creator-semantic-narrative-digest-selftest.js
          node --check creator-relevance-fallback-selftest.js
          node --check creator-procedural-fallback-selftest.js
          node --check creator-short-motion-selftest.js
          node --check creator-image-motion-selftest.js
          node --check creator-auto-web-selftest.js
