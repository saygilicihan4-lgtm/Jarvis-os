name: Jarvis CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, jarvis-local-brain-v2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Ensure FFmpeg for real Creator smoke
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q subtitles
      - name: Syntax check
        run: |
          node --check server.js
          node --check worker.js
          node --check jarvis-creator-engine.js
          node --check jarvis-creator-web-media.js
          node --check jarvis-creator-semantic-quality.js
          node --check jarvis-browser-operator.js
          node --check browser-operator-selftest.js
          node --check browser-mission-selftest.js
          node --check jarvis-commerce-engine.js
          node --check jarvis-youtube-studio.js
          node --check jarvis-mission-engine.js
          node --check mission-engine-selftest.js
          node --check mission-autoresume-selftest.js
