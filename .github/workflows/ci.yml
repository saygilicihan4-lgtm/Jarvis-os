name: Jarvis CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, jarvis-local-brain-v2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server.js
          node --check worker.js
          node --check jarvis-creator-engine.js
          node --check jarvis-browser-operator.js
          node --check browser-operator-selftest.js
          node --check jarvis-commerce-engine.js
          node --check jarvis-youtube-studio.js
          node --check jarvis-mission-engine.js
          node --check mission-engine-selftest.js
          node --check mission-autoresume-selftest.js
          node --check mission-scheduler-selftest.js
          node --check pc-acceptance-selftest.js
          node --check youtube-studio-selftest.js
          node --check commerce-engine-selftest.js
          node --check business-tools-selftest.js
          node --check routing-selftest.js
          node --check creator-engine-selftest.js
          node --check bootstrap-bridge-selftest.js
          python -m py_compile jarvis-local-stt-v4.py
      - name: STT lexicon selftest
        run: python stt-lexicon-selftest.py
      - name: STT adaptive latency selftest
        run: python stt-adaptive-selftest.py
      - name: UI selftest
        run: node ui-selftest.js
      - name: Creator engine selftest
        run: node creator-engine-selftest.js
      - name: Browser operator selftest
        run: node browser-operator-selftest.js
      - name: Commerce engine selftest
        run: node commerce-engine-selftest.js
      - name: Native business tools selftest
        run: node business-tools-selftest.js
      - name: YouTube Studio draft selftest
        run: node youtube-studio-selftest.js
      - name: Durable mission engine selftest
        run: node mission-engine-selftest.js
      - name: Mission auto-resume selftest
        run: node mission-autoresume-selftest.js
      - name: Mission scheduler selftest
        run: node mission-scheduler-selftest.js
      - name: PC acceptance snapshot selftest
        run: node pc-acceptance-selftest.js
      - name: Routing selftest
        run: node routing-selftest.js
      - name: Bootstrap bridge selftest
        run: node bootstrap-bridge-selftest.js
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./JARVIS-ZERO-COST-ONECLICK.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./JARVIS-LIVE-ACCEPTANCE.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./jarvis-startup.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./install-jarvis-startup.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./jarvis-self-update.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./jarvis-shopify-connect.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./JARVIS-PC-ACCEPTANCE.ps1 -Raw)) | Out-Null
      - name: Startup regression selftest
        shell: pwsh
        run: ./startup-selftest.ps1
      - name: Self-update regression selftest
        shell: pwsh
        run: ./self-update-selftest.ps1
      - name: Server selftest
        run: node selftest.js
      - name: Local Brain integration selftest
        run: node worker-selftest.js
