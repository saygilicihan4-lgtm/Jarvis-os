<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS OS</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>PERSONAL AUTONOMOUS SYSTEM</small><h1>JARVIS OS</h1></div><b id="health">●</b></header><section class="hero"><h2>Komuta Merkezi</h2><textarea id="cmd" placeholder="JARVIS'e görev ver..."></textarea><button onclick="send()">Görevi Başlat</button></section><section><h3>Görevler</h3><div id="tasks"></div></section><section><h3>Audit Log</h3><div id="audit"></div></section></main><script>async function api(u,o){return(await fetch(u,o)).json()}async function send(){let command=cmd.value.trim();if(!command)return;await api('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command})});cmd.value='';load()}async function load(){let d=await api('/api/state');tasks.innerHTML=d.tasks.slice().reverse().map(x=>'<article><b>'+x.agent+'</b> · <em>'+x.status+'</em><p>'+x.command+'</p><small>deneme '+x.attempts+'/'+x.maxRetries+(x.message?' · '+x.message:'')+'</small></article>').join('')||'<small>Henüz görev yok.</small>';audit.innerHTML=d.audit.slice(-12).reverse().map(x=>'<div class="log"><small>'+x.at+' · '+x.type+'</small> '+x.message+'</div>').join('')}load();setInterval(load,2500)</script></body></html>
